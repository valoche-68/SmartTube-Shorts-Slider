name: Auto-Sync, Build & Release (Stable & Pre-release)

on:
  schedule:
    # Check automatically every hour for both Beta and Stable releases
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to check/build'
        required: true
        type: choice
        options:
          - all
          - beta
          - stable
        default: all
      force_build:
        description: 'Force build even if version is already published'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Git & Sync Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yuliskov/SmartTube.git || true
          git fetch upstream master --no-tags

          if ! git merge upstream/master -m "chore(sync): automated sync with upstream"; then
            echo "Merge conflict detected! Aborting automated merge and notifying via Issue."
            gh issue create --title "⚠️ Merge conflict with upstream" --body "Automated sync encountered a conflict while merging upstream/master into main. Please review and resolve."
            exit 1
          fi

          git push origin main || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Keystore & Signing
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/smarttube-release.jks
          cat <<EOF > keystore.properties
          storeFile=${{ github.workspace }}/smarttube-release.jks
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Process Releases (Stable & Pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine channels to inspect
          CHANNELS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.channel }}" = "stable" ]; then
              CHANNELS=("stable")
            elif [ "${{ inputs.channel }}" = "beta" ]; then
              CHANNELS=("beta")
            else
              CHANNELS=("stable" "beta")
            fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ "$TAG_NAME" == *"beta"* || "$TAG_NAME" == *"pre"* ]]; then
              CHANNELS=("beta")
            else
              CHANNELS=("stable")
            fi
          else
            CHANNELS=("stable" "beta")
          fi

          echo "Channels to check: ${CHANNELS[*]}"

          gh repo set-default ${{ github.repository }} || true

          for CHANNEL in "${CHANNELS[@]}"; do
            echo "=========================================="
            echo "🔍 Checking channel: $CHANNEL"
            echo "=========================================="

            if [ "$CHANNEL" = "stable" ]; then
              UPSTREAM_INFO=$(gh release list --repo yuliskov/SmartTube --exclude-pre-releases --limit 1 --json tagName,name -q '.[0]')
              UPSTREAM_TAG=$(echo "$UPSTREAM_INFO" | jq -r .tagName)
              UPSTREAM_NAME=$(echo "$UPSTREAM_INFO" | jq -r .name)
              CLEAN_VERSION=$(echo "$UPSTREAM_TAG" | sed 's/[sv]//g')
              TARGET_TAG="v${CLEAN_VERSION}-shorts-slider"
              RELEASE_TITLE="SmartTube Shorts Slider v${CLEAN_VERSION} Stable"
              RELEASE_FLAG="--latest"
              GRADLE_TASK="assembleStstableRelease"
              FLAVOR="stable"
              FLAVOR_PREFIX="ststable"
              JSON_FILE="smarttube_stable2.json"
              TYPE_LABEL="Stable"
            else
              UPSTREAM_INFO=$(gh release list --repo yuliskov/SmartTube --limit 5 --json tagName,isPrerelease,name -q '.[] | select(.isPrerelease == true)' | head -n 1)
              UPSTREAM_TAG=$(echo "$UPSTREAM_INFO" | jq -r .tagName)
              UPSTREAM_NAME=$(echo "$UPSTREAM_INFO" | jq -r .name)
              CLEAN_VERSION=$(echo "$UPSTREAM_TAG" | sed 's/[sv]//g')
              TARGET_TAG="v${CLEAN_VERSION}-beta-shorts-slider"
              RELEASE_TITLE="SmartTube Shorts Slider v${CLEAN_VERSION} Beta (Pre-release)"
              RELEASE_FLAG="--prerelease"
              GRADLE_TASK="assembleStbetaRelease"
              FLAVOR="beta"
              FLAVOR_PREFIX="stbeta"
              JSON_FILE="smarttube_beta2.json"
              TYPE_LABEL="Beta (Pre-release)"
            fi

            # Check if triggered by manual tag push
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TARGET_TAG="${{ github.ref_name }}"
            fi

            # Check if this release tag already exists on our repository
            if gh release view "$TARGET_TAG" --repo ${{ github.repository }} >/dev/null 2>&1 && [ "${{ inputs.force_build }}" != "true" ]; then
              echo "✅ Release $TARGET_TAG ($TYPE_LABEL) already exists on ${{ github.repository }}. Skipping."
              continue
            fi

            echo "🚀 New $TYPE_LABEL release to build: $TARGET_TAG (Upstream: $UPSTREAM_NAME)"

            # Clean previous outputs
            ./gradlew clean
            rm -rf release_assets
            mkdir -p release_assets

            # Build APKs
            echo "🔨 Running: ./gradlew $GRADLE_TASK"
            ./gradlew "$GRADLE_TASK"

            # Copy APKs
            cp smarttubetv/build/outputs/apk/${FLAVOR_PREFIX}/release/*.apk release_assets/

            VERSION=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')
            VERSION_CODE=$(grep "versionCode" smarttubetv/build.gradle | head -n 1 | awk '{print $2}')

            # Generate OTA update JSON and Release Notes using python helper
            GITHUB_REPO="${{ github.repository }}" VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" TARGET_TAG="$TARGET_TAG" FLAVOR="$FLAVOR" JSON_FILE="$JSON_FILE" TYPE_LABEL="$TYPE_LABEL" python3 .github/scripts/generate_release_assets.py

            echo "📦 Publishing GitHub Release $TARGET_TAG ($RELEASE_TITLE)..."
            gh release create "$TARGET_TAG" release_assets/* \
              --repo ${{ github.repository }} \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              $RELEASE_FLAG \
              || gh release upload "$TARGET_TAG" release_assets/* --repo ${{ github.repository }} --clobber

            # Update rolling 'latest' release with latest OTA update metadata
            gh release upload latest release_assets/*.json --repo ${{ github.repository }} --clobber || true

            echo "🛡️ Triggering VirusTotal Scan for $TARGET_TAG..."
            gh workflow run virustotal_scan.yml --repo ${{ github.repository }} -f release_tag="$TARGET_TAG" || true

            # If stable release, commit and push updated README.md
            if [ "$FLAVOR" = "stable" ]; then
              git add README.md
              if ! git diff --cached --quiet; then
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git commit -m "docs: update README download links to v${VERSION} Stable"
                git push origin main || true
                echo "📝 Committed updated README.md for Stable version ${VERSION}"
              fi
            fi

            echo "✅ Successfully published $TARGET_TAG!"
          done
