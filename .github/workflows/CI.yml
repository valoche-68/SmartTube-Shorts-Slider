name: Validate application and configuration tool

on:
  push:
    branches: [main]
    paths-ignore: ['smarttube_*.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Test configuration and release checks
        run: python -m unittest discover -s tools/tests -v
      - name: Launch downloaded assistant help (Linux and macOS)
        if: runner.os != 'Windows'
        run: sh tools/start.sh --help
      - name: Launch downloaded assistant help (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ([scriptblock]::Create((Get-Content -Raw tools/start.ps1))) --help'
      - name: Reject private files and credentials
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check_sensitive_files.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;30.0.3' 'platforms;android-34' 'ndk;21.0.6113669'
      - name: Apply reviewed media patch
        run: python3 fork/apply_media_patch.py
      - name: Validate both Android variants
        run: >-
          bash gradlew :common:testStstableDebugUnitTest
          --tests '*ShortsPreferencesTest' --tests '*NextVideoPreloaderTest' --tests '*PlaybackNonceIsolationTest'
          :common:testStbetaDebugUnitTest
          --tests '*ShortsPreferencesTest' --tests '*NextVideoPreloaderTest' --tests '*PlaybackNonceIsolationTest'
          :smarttubetv:assembleStstableDebug :smarttubetv:assembleStbetaDebug --console=plain
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-test-reports
          path: common/build/reports/tests/
          retention-days: 30
