name: VirusTotal Scan
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to scan
        required: true
permissions:
  contents: write
concurrency:
  group: virustotal-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Download APKs
        run: gh release download "$TAG" --repo "$GH_REPO" --dir release_assets --pattern '*.apk'
      - name: Submit to VirusTotal
        if: env.HAS_VT_KEY == 'true'
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: release_assets/*.apk
          request_rate: 4
      - name: Link to reports without inventing a verdict
        run: python3 .github/scripts/virustotal_notes.py
