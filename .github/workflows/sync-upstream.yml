name: Sync with Upstream SmartTube

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream and Fetch
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          git fetch upstream master --tags

      - name: Sync Master with Upstream
        run: |
          git checkout master
          git merge upstream/master -m "chore(sync): sync master with upstream yuliskov/SmartTube"
          git push origin master --tags
